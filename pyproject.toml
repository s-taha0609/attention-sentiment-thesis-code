[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "attention-sentiment-thesis"
version = "0.1.0"
description = "Code-only reproducibility package for attention, sentiment, and stock-return analyses"
readme = "README.md"
requires-python = ">=3.10"
authors = [{name = "Shintaro Tahara"}]
license = {file = "LICENSE"}
classifiers = [
  "License :: OSI Approved :: MIT License",
]
dependencies = [
  "numpy>=1.24",
  "pandas>=2.0",
  "scipy>=1.10",
  "statsmodels>=0.14",
  "linearmodels>=6",
]

[project.optional-dependencies]
figures = ["matplotlib>=3.7"]
test = ["pytest>=8"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
